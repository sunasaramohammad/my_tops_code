<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="first.css">
    <title>Document</title>
</head>
<body>
    <table>
    <form>
        <tr>
            <td>
                <h1>Student Registration Form</h1>
            </td>
        </tr>

        <tr>
        <td>
            <label for="RollNo">RollNo:</label>
            <input type="text" name="RollNo">
        </td>
    
        </tr>

        <tr>
        <tr>
            <td>
                <label for="StudentName">StudentName:</label>
                <input type="text" name="firstName" placeholder="First Name">
                <input type="text" name="lastName" placeholder="Last Name">
            </td>
        </tr>
        <tr>
            <td>
                <label for="Fathername">FatherName:</label>
                <input type="text" name="Fathername" placeholder="Father Name" ><br>
            </td>
            <td></td>
        </tr>

        <tr>
            <td>
                <label for="DateofBirth">Date of Birth:</label>
                <input type="date" name="DateofBirth">(DD/MM/YYYY)
            </td>
        </tr>
        
        <tr>
            <td>
                <label for="MobileNo">Mobile No:</label>
                <input type="text" name="MobileNo">
            </td>
        </tr>

        <tr>
            <td>
                <lable for="Email">Email:</lable>
                <input type="email" name="email">
            </td>
        </tr>
        <tr>
            <td>
                <label for="Password">Password:</label>
                <input type="password" name="Password">
            </td>
        </tr>

        <tr>
            <td>
                <label for="Gender">Gender:</label>
                <input type="radio" name="Gender" value="Male">Male
                <input type="radio" name="Gender" value="Female">Female
            </td>
        </tr>

        <tr>
            <td>
                <label for="department">Department:</label>
                <input type="checkbox" name="CSE" value="CSE">CSE
                <input type="checkbox" name="IT" value="IT">IT
                <input type="checkbox" name="ECE" value="ECE">ECE
                <input type="checkbox" name="civil" value="civil">Civil
                <input type="checkbox" name="mech" value="mech">Mech
            </td>
        </tr>
        <tr>
            <td>
                <label for="Course">Course:</label>
                <select name="Course">
                    <option value="---------------">-------------Select Course------------- </option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="M.Tech">M.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>
                <label for="photo">StudentPhoto:</label>
                <input type="file" name="photo">
            </td>
        </tr>

        <tr>
            <td>
                <lable for="City">City:</lable>
                <input type="text" name="City">
            </td>
        </tr>

        <tr>
            <td>
                <label for="Address">Address:</label>
                <textarea name="Address" rows="5" cols="30"></textarea>
            </td>
        </tr>

        <tr>
            <td>
                <input type="submit" value="Register">
               
            </td>
        </tr>
    </form>
    </table>
</body>
</html>
